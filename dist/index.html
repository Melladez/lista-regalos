<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guarda y organiza tus ideas de regalo.">
  <title>Mi lista de regalos</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="regalos.js" defer></script>
</head>
<body>
  <main class="wrap">
    <section class="hero" aria-labelledby="titulo">
      <div class="hero-copy">
        <h1 id="titulo">Mi lista de<br><em>Navidad</em></h1>
        <p>Guarda los regalos que te haría ilusión encontrar bajo el árbol.</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="ornament ornament-gold"></span>
        <span class="ornament ornament-green"></span>
        <div class="present"><i></i><b></b><span>✧</span><small>✦</small></div>
      </div>
    </section>
    <div class="toolbar">
      <div class="section-title">
        <button type="button" id="order-toggle" aria-label="Ordenar regalos" aria-pressed="false" aria-controls="gifts" title="Ordenar regalos" disabled>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="m15 5 4 4M4 20l4.6-1 11-11a2.8 2.8 0 0 0-4-4l-11 11L4 20Z"/>
          </svg>
        </button>
        <h2 id="lista-titulo">Mis regalos</h2><span id="count"></span>
      </div>
      <button type="button" id="form-toggle" aria-expanded="false" aria-controls="gift-panel"><span aria-hidden="true" class="toggle-icon"></span><span id="form-title">Añadir regalo</span></button>
    </div>
    <div class="workspace">
      <section aria-labelledby="lista-titulo">
        <div id="empty" class="empty">
          <span aria-hidden="true">✧</span>
          <h3>Tu lista empieza aquí</h3>
          <p>Añade tu primer regalo con el formulario.</p>
        </div>
        <ul id="gifts"></ul>
      </section>
      <div class="form-reveal" id="gift-panel" inert>
        <div class="form-clip">
          <div class="panel">
            <form id="gift-form">
              <label for="name">Nombre</label>
              <input id="name" name="name" maxlength="100" required placeholder="Ej. Una cámara instantánea">
              <label for="link">Enlace</label>
              <input id="link" name="link" type="url" maxlength="2048" required placeholder="https://…">
              <label for="price">Precio (€)</label>
              <input id="price" name="price" type="text" inputmode="decimal" maxlength="12" required placeholder="0,00">
              <label for="description">Descripción <small>(opcional)</small></label>
              <textarea id="description" name="description" maxlength="300" rows="3" placeholder="Color, talla o algún detalle…"></textarea>
              <fieldset class="image-options">
                <legend>Imagen <small>(opcional)</small></legend>
                <button type="button" id="find-image">Buscar imagen del producto</button>
                <label for="image-url">Enlace directo a la imagen</label>
                <input id="image-url" type="url" placeholder="https://…">
                <label for="image-file">Subir una foto</label>
                <input id="image-file" type="file" accept="image/*">
                <p id="image-status" role="status"></p>
                <img id="image-preview" alt="Vista previa del regalo" referrerpolicy="no-referrer" hidden>
                <button type="button" id="clear-image" hidden>Quitar imagen</button>
              </fieldset>
              <button class="primary" id="save" type="submit">Guardar regalo</button>
              <button id="cancel" type="button" hidden>Cancelar edición</button>
            </form>
            <p class="storage">La lista se guarda en este navegador.</p>
          </div>
        </div>
      </div>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
